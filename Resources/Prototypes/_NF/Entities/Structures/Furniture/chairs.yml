- type: entity
  id: StoolColor
  suffix: Colorful
  parent: Stool
  description: Apply butt to color.
  components:
  - type: Sprite
    sprite: _NF/Structures/Furniture/chairs.rsi
    layers:
    - state: stool-base
    - state: stool-cover
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          stool-cover: Rainbow

- type: entity
