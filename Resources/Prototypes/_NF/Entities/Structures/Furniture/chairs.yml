  description: You sit in this wonderful color. Either by will or force.
  components:
  - type: Sprite
    sprite: _NF/Structures/Furniture/chairs.rsi
    layers:
    - state: bar-base
    - state: bar-cover
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
